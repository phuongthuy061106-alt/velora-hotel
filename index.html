<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velora Hotel - Hệ thống quản lý khách sạn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261118bh" />
</head>
<body>

  <!-- ==================== 1. TRANG ĐĂNG NHẬP ==================== -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-form-header">
        <h1>Velora Hotel</h1>
        <p>Đăng nhập hệ thống quản lý nội bộ</p>
      </div>

      <form id="loginForm" class="login-form">
        <div id="loginError" class="login-error hidden">
          Tài khoản hoặc mật khẩu không chính xác.
        </div>

        <div class="form-group">
          <label for="usernameInput">Tài khoản</label>
          <div class="input-wrapper">
            <input type="text" id="usernameInput" placeholder="Nhập tài khoản" required autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label for="passwordInput">Mật khẩu</label>
          <div class="input-wrapper">
            <input type="password" id="passwordInput" placeholder="Nhập mật khẩu" required autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="margin-top: 4px; width: 100%;">
          Đăng nhập
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== 2. TRANG QUẢN LÝ CHÍNH ==================== -->
  <div id="appLayout" class="app-layout hidden">
    <!-- Sidebar điều hướng -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="hotel-brand-text">
          <h2>Velora Hotel</h2>
          <span>Quản lý khách sạn</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Danh mục</div>

        <!-- 1. Tổng quan -->
        <button type="button" class="nav-item active" data-view="dashboard">
          <span>Tổng quan</span>
        </button>

        <!-- 2. Phòng (Loại phòng, Phòng) -->
        <div class="nav-group open" id="navGroupRoom">
          <button type="button" class="nav-group-toggle" data-group="navGroupRoom">
            <span>Phòng</span>
            <span class="nav-arrow">&#9662;</span>
          </button>
          <div class="nav-submenu">
            <button type="button" class="nav-subitem" data-view="room-categories">
              <span>Loại phòng</span>
            </button>
            <button type="button" class="nav-subitem" data-view="rooms">
              <span>Phòng</span>
            </button>
          </div>
        </div>

        <!-- 2.5 Bảng giá -->
        <button type="button" class="nav-item" data-view="price-plans">
          <span>Bảng giá</span>
        </button>

        <!-- 2.5 Dịch vụ (DichVu) -->
        <button type="button" class="nav-item" data-view="services">
          <span>Dịch vụ</span>
        </button>

        <!-- 3. Giao dịch (Đơn đặt phòng, Lưu trú, Phát sinh, Thanh toán, Lịch sử thay đổi) -->
        <div class="nav-group open" id="navGroupTransaction">
          <button type="button" class="nav-group-toggle" data-group="navGroupTransaction">
            <span>Giao dịch</span>
            <span class="nav-arrow">&#9662;</span>
          </button>
          <div class="nav-submenu">
            <button type="button" class="nav-subitem" data-view="bookings">
              <span>Đặt phòng</span>
            </button>
            <button type="button" class="nav-subitem" data-view="invoices">
              <span>Thanh toán</span>
            </button>
          </div>
        </div>

        <!-- 4. Khách hàng (KhachHang) -->
        <button type="button" class="nav-item" data-view="customers">
          <span>Khách hàng</span>
        </button>

        <!-- 5. Quản trị viên (QuanTriVien) -->
        <button type="button" class="nav-item" data-view="staff">
          <span>Quản trị viên</span>
        </button>

        <!-- 6. Báo cáo -->
        <div class="nav-group open" id="navGroupReports">
          <button type="button" class="nav-group-toggle" data-group="navGroupReports">
            <span>Báo cáo</span>
            <span class="nav-arrow">&#9662;</span>
          </button>
          <div class="nav-submenu">
            <button type="button" class="nav-subitem" data-view="report-revenue-total">
              <span>Doanh thu tổng</span>
            </button>
            <button type="button" class="nav-subitem" data-view="report-revenue-service">
              <span>Doanh thu dịch vụ</span>
            </button>
            <button type="button" class="nav-subitem" data-view="report-room-usage">
              <span>Tần suất sử dụng phòng</span>
            </button>
          </div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button type="button" id="logoutBtn" class="btn btn-danger btn-sm" style="width: 100%;">
          Đăng xuất
        </button>
      </div>
    </aside>

    <!-- Nội dung chính -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <div class="breadcrumb">
            <span class="breadcrumb-parent" id="breadcrumbParent">Hệ thống</span>
            <span>/</span>
            <span class="breadcrumb-current" id="breadcrumbCurrent">Tổng quan</span>
          </div>
        </div>

        <div class="topbar-right">
          <button type="button" id="resetDemoDataBtn" class="btn btn-outline btn-sm">
            Khôi phục dữ liệu mẫu
          </button>
          <div class="user-profile-pill">
            <span class="user-info-text"><strong id="currentUserDisplay">admin</strong></span>
          </div>
        </div>
      </header>

      <main class="main-content">
        <!-- 1. VIEW: TỔNG QUAN -->
        <section id="view-dashboard" class="view-section"></section>

        <!-- 2.1 VIEW: PHÒNG -> LOẠI PHÒNG -->
        <section id="view-room-categories" class="view-section hidden"></section>

        <!-- 2.1.5 VIEW: PHÒNG -> BẢNG GIÁ -->
        <section id="view-price-plans" class="view-section hidden"></section>

        <!-- 2.2 VIEW: PHÒNG -> PHÒNG -->
        <section id="view-rooms" class="view-section hidden"></section>

        <!-- 2.5 VIEW: DỊCH VỤ -->
        <section id="view-services" class="view-section hidden"></section>

        <!-- 3.1 VIEW: GIAO DỊCH -> ĐẶT PHÒNG & LƯU TRÚ -->
        <section id="view-bookings" class="view-section hidden"></section>

        <!-- 3.2 VIEW: GIAO DỊCH -> THANH TOÁN -->
        <section id="view-invoices" class="view-section hidden"></section>

        <!-- 4. VIEW: KHÁCH HÀNG -->
        <section id="view-customers" class="view-section hidden"></section>

        <!-- 5. VIEW: QUẢN TRỊ VIÊN -->
        <section id="view-staff" class="view-section hidden"></section>

        <!-- 5. VIEW: BÁO CÁO -->
        <section id="view-reports" class="view-section hidden"></section>
      </main>
    </div>
  </div>

  <!-- ==================== MODAL ĐA NĂNG ==================== -->
  <div id="commonModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">Thông tin</h3>
        <button type="button" id="modalCloseBtn" class="modal-close">&times;</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFooter" class="modal-footer"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-sync.js"></script>
</body>
</html>
